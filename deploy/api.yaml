apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: splitr
data:
  API_ADDR: ":8080"
  WEB_ORIGIN: "http://splitr.local"
  SESSION_COOKIE_NAME: "splitr_session"
  SESSION_TTL_HOURS: "168"
  DATABASE_URL: "postgres://splitr:splitr@postgres:5432/splitr?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: splitr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: splitr-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: PASSWORD_PEPPER
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: splitr
type: Opaque
stringData:
  PASSWORD_PEPPER: "change-me"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: splitr
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
