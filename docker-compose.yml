services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitr
      POSTGRES_PASSWORD: splitr
      POSTGRES_DB: splitr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitr -d splitr"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://splitr:splitr@postgres:5432/splitr?sslmode=disable", "up"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://splitr:splitr@postgres:5432/splitr?sslmode=disable
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
